spring.application.name=turnos-service
server.port=8081

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

catalogo.url=${CATALOGO_SERVICE_URL}
catalogo.client-id=${SERVICE_CLIENT_ID}
catalogo.client-secret=${SERVICE_CLIENT_SECRET}

catedra.url=${CATEDRA_BASE_URL}
catedra.jwt=${CATEDRA_JWT}
catedra.group-id=${CATEDRA_GROUP_ID}
catedra.kafka.appointment-actions-topic=${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC}
catedra.kafka.appointment-phone-topic=${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC}

spring.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true