services:
  postgres:
    image: postgres:16
    container_name: turnos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - turnos_postgres_data:/var/lib/postgresql/data

volumes:
  turnos_postgres_data: